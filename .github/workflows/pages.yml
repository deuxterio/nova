name: Publicar NOVA ARENA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y comprobar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar reglas del juego
        run: npm test
      - name: Compilar sitio estático
        run: npm run build
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar juego
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
